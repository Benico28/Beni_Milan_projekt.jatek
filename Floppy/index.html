<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="https://flappybird.guru/favicon.ico">
</head>

<body class="text-white">
    <header class="">
        <div class="container ">
            <div class="d-flex">
                <p class=" mt-2"><img src="https://flappybird.guru/image/android-chrome-192x192.png" alt="Flappy Bird" class="birdimg mt-1"></p>
                <h2 class="ms-4 pt-3 ">Flappy Bird</h2>
                <p class="ms-auto pt-3 mt-1 p-2"><button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#exampleModal">Szabályok</button></p>
            </div>
            

                
        </div>
    </header>
    <main>
        <section class="py-5">
            <div class="container">
                <div class="gameArea">
                    <p><img src="img/Flappybg.png" alt="Game Area" title="Game Area" class="w-100"></p>
                </div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    <div class="modal" id="exampleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modal title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Modal body text goes here.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
